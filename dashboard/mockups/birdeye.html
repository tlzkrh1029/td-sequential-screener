<style id="be-shell-css">
/* Bird eye design study. Views behind the screener's app bar: the bird eye chart of one coin, and the three earlier
   screens (whole market, one coin on many timeframes, timeframe ladder) with two variants each to compare. A page
   holds the views whose files it was built with (scripts/build-site.mjs --includes). Tokens, controls and marks are
   the screener's own (dashboard/screener.html), so a chosen variant can move into the site as it is. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --sunken: #eef1f4; --fg: #141922; --muted: #5b6574; --faint: #737c8a;
  --line: #dfe3e8; --accent: #2f5bd3; --accent-soft: #e6ecfb; --warn-bg: #fff6db; --warn-fg: #7a5a00; --hl: #f2b300;
  --bad-bg: #fde7e7; --bad-fg: #9b1116; --ok-fg: #0f7b3b;
  --up: #089981; --down: #F23645; --setup: #787B86; --setup-ink: #5f626b;
  --f0: #DC2A2A; --f1: #EB9223; --f2: #74279A; --f3: #E74BB1;
  --fi0: #ffffff; --fi1: #141922; --fi2: #ffffff; --fi3: #141922;
  --font-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #151a21; --sunken: #1b2129; --fg: #e5e8ee; --muted: #9aa3b1; --faint: #6c7584;
    --line: #262e39; --accent: #7d9cf5; --accent-soft: #1e2840; --warn-bg: #33290d; --warn-fg: #f2cf6b; --hl: #ffc93c;
    --bad-bg: #3b1416; --bad-fg: #ff8a84; --ok-fg: #3ddc84; --setup-ink: #a3a6b0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #151a21; --sunken: #1b2129; --fg: #e5e8ee; --muted: #9aa3b1; --faint: #6c7584;
  --line: #262e39; --accent: #7d9cf5; --accent-soft: #1e2840; --warn-bg: #33290d; --warn-fg: #f2cf6b; --hl: #ffc93c;
  --bad-bg: #3b1416; --bad-fg: #ff8a84; --ok-fg: #3ddc84; --setup-ink: #a3a6b0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; word-break: keep-all; overflow-wrap: break-word; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 600; }
button { font: inherit; color: inherit; }
input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* shell (as the screener) */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--surface); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar-in { max-width: 2200px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 0 18px; min-height: 52px; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand small { font-family: var(--font-mono); font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 8px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14px; padding: 14px 12px 12px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs a:focus-visible { outline-offset: -2px; }
.wrap { max-width: 2200px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; display: grid; gap: 12px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.lead { margin: 0; font-size: 13px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 12px; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.ctl > span { font-size: 12px; color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; border-radius: 9px; background: var(--sunken); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .14); }
.seg.fam button i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.seg.fam button[aria-pressed="false"] i { opacity: .35; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--fg); }
.btn:hover { background: var(--sunken); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.loading, .empty { padding: 36px 12px; text-align: center; color: var(--muted); font-size: 13px; }
.foot { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 4px; }

/* indicator marks (as the screener): 13 = filled chip in the family color, 9 = gray outline, +13 = small colored text */
.k13, .k9, .kd { font-family: var(--font-mono); font-weight: 600; font-style: normal; white-space: nowrap; display: inline-block; }
.k13 { font-size: 11px; line-height: 15px; padding: 0 3px; border-radius: 4px; background: var(--c); color: var(--i); }
.k9 { font-size: 11px; line-height: 13px; padding: 0 3px; border-radius: 4px; border: 1px solid var(--setup); color: var(--setup-ink); }
.kd { font-size: 9.5px; line-height: 1; color: var(--c); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

/* tooltip */
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgb(0 0 0 / .18); padding: 8px 10px; font-size: 12px; max-width: min(380px, calc(100vw - 16px)); display: none; }
.tip .h1 { font-family: var(--font-mono); font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.tip .m { color: var(--muted); }
.tip .sec { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); display: grid; gap: 3px; }
.tip .row { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }

/* study shell: which variant, which coin, what the variant is */
.vnote { padding: 8px 14px 9px; display: grid; gap: 3px; }
.vnote h2 { font-size: 15px; }
.vnote h2 small { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 8px; }
.vnote p { margin: 0; font-size: 13px; }
.vnote .pc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 28px; font-size: 12.5px; color: var(--muted); }
.vnote .pc b { color: var(--fg); font-weight: 600; }
.note-btn { margin-left: auto; }
@media (max-width: 900px) { .vnote .pc { grid-template-columns: minmax(0, 1fr); } }
.coinhead { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.coinhead h1 { font: 700 22px var(--font-mono); }
.coinhead .nm { color: var(--muted); }
.coinhead .meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.coinpick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.coinpick input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; width: 150px; max-width: 100%; }
.coinpick .quick { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.coinpick .quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; font: 600 12px var(--font-mono); cursor: pointer; color: var(--fg); }
.coinpick .quick button[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
#stage { min-width: 0; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }

@media (max-width: 720px) {
  .appbar-in, .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .appbar-in { gap: 0 10px; }
  .brand { padding-top: 8px; }
  .tabs a { padding: 10px 9px 9px; font-size: 13.5px; }
  .coinhead h1 { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

<script>
const DATA = /*__DATA__*/null;
/*__BARS__*/
/*__ENGINE__*/
/*__MODULE:VIEW:../td-view.js__*/
// ====================================================================================================================
// BE: the study's core. Every variant file (be-<view>-<a|b>.js, one <script> each below) registers itself with
// BE.register and draws only from what BE gives it. Nothing here or in a variant computes a TD count of its own:
// labels, counts and next-bar triggers come from the engine (TD), bars from BARS, distances from VIEW (td-view.js).
//
// Data
//   BE.COINS            every coin of the build, by market-cap rank: {r rank, s symbol, n name, k Korean name | null,
//                       x exchanges ("UBN": U 업비트, B 빗썸, N 바이낸스), mc market cap, usd ticker | null, slug,
//                       lc newest daily close, li / lb first / last daily bar day, t: per timeframe the build summary
//                       | null (scripts/build-site.mjs summarize: n, ls, le, ps, pl, br, sr, ru, rl, l9, l13, tg, po),
//                       t absent when the coin has no data}
//   BE.TFS, BE.OPT      the 20 timeframes; the indicator inputs (TD Research v6 defaults)
//   BE.LAST, BE.DATA    the last closed day (unix day number); the whole build data
//   BE.FAMS             the families the indicator counts ([0, 2, 3] with the defaults); BE.FAM_NAME / FAM_CODE /
//                       FAM_COLOR by family 0-3; BE.SETUP_COLOR; BE.BUY = -1, BE.SELL = 1, BE.SIDE, BE.ARROW
//   BE.side(c, j, dir)  one side of one timeframe of a coin from the summary, cached: VIEW.sideState(...) =
//                       {raw, to9, runs: [{f, count, hi}], labels: [{ago, kind 'S'|'I'|'C', f, text, raw, rep}],
//                        trigs: [{t, k 'S9'|'S9r'|'C13', d, f, o, fire}], next13, next9}; fire = VIEW.fire(...) =
//                       {now, p, pct, q, qpct, dir} | null (see td-view.js). null when the coin has no bar there.
//                       The caller applies the family toggles (BE.famOn(f)).
//   BE.detail(c)        Promise of one coin recounted in the browser from its daily data (cached):
//                       {c, d daily data, mintick, last newest daily close, tfs: [per timeframe {tf, j, bars
//                        (BARS.buildBars: start, end, first, last, o, h, l, c, n, partial), res (TD.runTD: labels,
//                        chartVisibleFrom, state) | null without bars, base (VIEW.baseBar), trigs (VIEW.withFire of
//                        TD.nextBarTriggers), runs: [{family, direction, n, originBar, originDay, ageBars}],
//                        pad() label offsets, byBar() Map bar -> label indices}]}
//                       Rejects with an Error (err.stale = a newer build was deployed) when the data cannot be read.
// Shared state
//   BE.state            {view 'chart'|'market'|'sheet'|'ladder', key 'a'|'b' (the variant shown), coin (slug), fam: [..]}
//   BE.coin()           the coin of the per-coin views; BE.famOn(f); BE.go({view, key, coin}) navigates (hash)
//   BE.openCoin(slug, view = 'sheet')   from the market views: show that coin
//   BE.vstate(id, defaults)             a variant's own settings object, kept in localStorage; BE.save() after a change
// Drawing
//   BE.el(tag, cls, text), BE.esc, BE.iso(day), BE.nf, BE.fmtPrice, BE.fmtPct(x), BE.fmtCap
//   BE.chipHTML(kind, text, f) / BE.chipEl(...)   the screener's marks: 'C' 13 chip, 'S' 9 chip, 'I' +13
//   BE.seg(label, [[value, text], ...], get, set)  a labelled segmented control (returns the .ctl element)
//   BE.tip.show(x, y, nodes | html), BE.tip.hide()
//   BE.setupCanvas(cv, w, h) -> ctx (device pixel ratio handled); BE.C canvas colors of the current theme
//   BE.padArray(bars, mintick), BE.labelPrice(L, bars, pad), BE.labelColor(L), BE.LABEL_FONT   where and how the
//                       indicator draws a label (as the screener's coin chart)
//   BE.dateTicks(days, px), BE.tvUrl(usd, tf), BE.exNames(c), BE.nameOf(c), BE.agoText(ago)
//   BE.EX_NAME {U, B, N}, BE.GROUP_START (Set of the timeframe indices a group gap comes before: 8D and 1M),
//   BE.hrefOf(view, slug) the hash of a coin in a view (with the variant last shown there), BE.isDark(),
//   BE.findCoins(text) the coins a search text means, BE.lastBar(j) {ls, le, coins} the last confirmed bar most coins
//   have on timeframe j, BE.isLate(c, j) the coin's last confirmed bar there is older than that
//   BE.trigText(t) a next-bar trigger as a sentence; BE.fireText(fire) where the bar in progress stands against it
//   The root element carries --appbar-h, the height of the sticky app bar.
// A variant
//   BE.register({ view, key, name, blurb, good: [..], weak: [..], mount(root), render(why), unmount() })
//     mount(root)   build the variant's DOM inside root (an empty element); called each time the variant is shown
//     render(why)   draw from the shared state; called after mount and on 'coin', 'fam', 'theme', 'resize'
//     unmount()     optional: stop timers, drop listeners outside root
//   good and weak may be left out: the description then shows the blurb alone, and stays folded until it is asked for.
// The page shows what was registered: a tab per view that has a variant (none when there is one view), the variant
// switch where a view has two, and the first such view when the address names none.
// ====================================================================================================================
// A host that puts this page inside its own <body> (a published artifact) leaves the style element above in the body,
// while the variants append theirs to <head>. Move it to the head, so that a variant's rule still comes after a shell
// rule of the same weight, as it does when this page is its own document.
{ const css = document.getElementById('be-shell-css'); if (css && css.parentNode !== document.head) document.head.append(css); }
const BE = (() => {
  const TFS = DATA.tfs, OPT = DATA.options, LAST = DATA.lastClosedDayN, DAY = 86400000;
  const COINS = DATA.coins.slice().sort((a, b) => a.r - b.r);
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const iso = (d) => BARS.isoOfDay(d);
  const nf = (v) => Number(v).toLocaleString('en-US');
  const BUY = -1, SELL = 1, SIDE = { [BUY]: '매수', [SELL]: '매도' }, ARROW = { [BUY]: '▼', [SELL]: '▲' };

  // ---------- families and colors (the indicator's inputs) ----------
  const FAM_NAME = ['Sequential', 'Aggressive Sequential', 'Combo', 'Aggressive Combo'];
  const FAM_CODE = ['S', 'AS', 'C', 'AC'];
  const FAM_COLOR = [OPT.seqColor, OPT.aggSeqColor, OPT.comboColor, OPT.aggComboColor];
  const FAMS = [0, 1, 2, 3].filter((f) => [OPT.enableSeq, OPT.enableAggSeq, OPT.enableCombo, OPT.enableAggCombo][f]);
  const SETUP_COLOR = OPT.setupColor || '#787B86';
  function hexRgb(hex) { const h = String(hex).replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
  function relLum(c) { const f = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); }
  function inkOn(hex) { const L = relLum(hexRgb(hex)), dark = relLum([20, 25, 34]); return 1.05 / (L + 0.05) >= (L + 0.05) / (dark + 0.05) ? '#ffffff' : '#141922'; }
  {
    const st = document.documentElement.style;
    FAM_COLOR.forEach((c, f) => { st.setProperty('--f' + f, c); st.setProperty('--fi' + f, inkOn(c)); });
    st.setProperty('--setup', SETUP_COLOR);
  }
  const C = {};
  let DARK = false;
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ['fg', 'muted', 'faint', 'line', 'surface', 'sunken', 'accent', 'accent-soft', 'up', 'down', 'bg', 'hl', 'setup-ink']) C[k] = cs.getPropertyValue('--' + k).trim();
    DARK = /^#[0-9a-f]{6}$/i.test(C.surface) ? relLum(hexRgb(C.surface)) < 0.2 : false;
  }
  const isDark = () => DARK;

  // ---------- numbers and names ----------
  function fmtPrice(v) {
    if (v == null || !Number.isFinite(v)) return '–';
    const a = Math.abs(v);
    let s = Number(v.toPrecision(a >= 1 ? 12 : 10)).toString();
    if (/e/i.test(s)) s = v.toFixed(Math.min(20, Math.max(0, 8 - Math.floor(Math.log10(a))))).replace(/0+$/, '').replace(/\.$/, '');
    const neg = s.startsWith('-'); if (neg) s = s.slice(1);
    const [i, f] = s.split('.');
    return (neg ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
  }
  // a signed percent of a ratio difference: 0.0123 -> "+1.2%", -0.201 -> "−20.1%", 0 -> "0%"
  function fmtPct(x) {
    if (x == null || !Number.isFinite(x)) return '–';
    if (x === 0) return '0%';
    const a = Math.abs(x * 100), s = a >= 100 ? a.toFixed(0) : a >= 10 ? a.toFixed(1) : a >= 0.1 ? a.toFixed(1) : a.toFixed(2);
    return (x < 0 ? '−' : '+') + s + '%';
  }
  function fmtCap(v) {
    if (!(v > 0)) return '–';
    const [d, u] = v >= 1e12 ? [1e12, 'T'] : v >= 1e9 ? [1e9, 'B'] : v >= 1e6 ? [1e6, 'M'] : [1e3, 'K'];
    const x = v / d; return '$' + (x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2)) + u;
  }
  const EX_NAME = { U: '업비트', B: '빗썸', N: '바이낸스' };
  const exNames = (c) => ['U', 'B', 'N'].filter((x) => c.x.includes(x)).map((x) => EX_NAME[x]).join(' · ') || '업비트·빗썸·바이낸스 미상장(직접 추가한 종목)';
  const nameOf = (c) => c.k || c.n;
  const agoText = (ago) => (ago === 0 ? '마지막 봉' : ago + '봉 전');

      if (c.lc != null) meta.append(el('span', 'num', `최근 종가 ${fmtPrice(c.lc)} (${DATA.lastClosedDay} 마감)`));
      if (c.usd) { const a = el('a', null, 'TradingView 차트 ↗'); a.href = tvUrl(c.usd, '1D'); a.target = '_blank'; a.rel = 'noopener'; meta.append(a); }
      head.append(meta);
      $('coinInput').value = '';
      $('coinInput').placeholder = `${c.s} · 심볼 검색`;
      const i = WITH_DATA.indexOf(c);
      $('prevCoin').disabled = i <= 0; $('nextCoin').disabled = i < 0 || i >= WITH_DATA.length - 1;
      for (const b of $('quick').children) b.setAttribute('aria-pressed', String(b.dataset.slug === c.slug));
    }
    $('famSeg').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(famOn(Number(b.dataset.fam)))));
  }
  function start() {
    readColors();
    $('asof').textContent = `${DATA.lastClosedDay} 마감 · 실제 데이터`;
    // the introduction follows what the page holds: variants to compare, or one screen (for a few coins)
    const live = liveViews(), few = WITH_DATA.length <= FEW_COINS;
    const counted = `모든 숫자는 ${DATA.lastClosedDay} 마감 봉까지의 실제 데이터를 TD Research v6 기본 설정으로, 사이트와 같은 엔진으로 센 값입니다.`;
    let intro = '이 페이지는 bird eye 화면의 시안입니다.';
    if (live.some((v) => keysOf(v).length > 1)) intro += ' 화면마다 시안 A와 B를 바꿔 보시고, 마음에 드는 쪽과 고칠 점을 알려 주세요.';
    else if (live.length === 1) {
      const name = VIEWS.find((x) => x[0] === live[0])[1], last = name.charCodeAt(name.length - 1);
      const obj = last >= 0xAC00 && last <= 0xD7A3 && (last - 0xAC00) % 28 ? '을' : '를';   // 차트를, 한 장을
      const count = ['', '한', '두', '세', '네', '다섯', '여섯', '일곱', '여덟'][WITH_DATA.length];
      intro = few && count ? `이 페이지는 ${name}${obj} ${WITH_DATA.map((c) => c.s).join(', ')} ${count} 종목에 먼저 적용한 시안입니다.` : `이 페이지는 ${name} 시안입니다.`;
    }
    $('lead').textContent = `${intro} ${counted}`;
    const barH = () => document.documentElement.style.setProperty('--appbar-h', document.querySelector('.appbar').offsetHeight + 'px');
    barH(); addEventListener('resize', barH);
    $('noteBtn').addEventListener('click', () => { state.note = !state.note; state.noteSaved = state.note; save(); syncShell(); renderActive('resize'); });
    // a tab per view the page has; one view needs no tabs
    const tabs = $('tabs');
    for (const [v, name] of VIEWS) { if (!live.includes(v)) continue; const a = el('a', null, name); a.dataset.view = v; tabs.append(a); }
    tabs.hidden = live.length < 2;
    const dl = $('coinList');
    for (const c of WITH_DATA) { const o = el('option'); o.value = c.s; o.label = `${c.r}위 ${nameOf(c)}`; dl.append(o); }
    const pick = (text) => {
      const q = String(text || '').trim().toLowerCase(); if (!q) return;
      const c = WITH_DATA.find((x) => x.s.toLowerCase() === q) || WITH_DATA.find((x) => (x.k || '').toLowerCase() === q || x.n.toLowerCase() === q) || WITH_DATA.find((x) => x.s.toLowerCase().startsWith(q));
      if (c) go({ coin: c.slug });
    };
    $('coinInput').addEventListener('change', (e) => pick(e.target.value));
    $('coinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { pick(e.target.value); e.target.blur(); } });
    const step = (k) => { const i = WITH_DATA.indexOf(coin()); const c = WITH_DATA[i + k]; if (c) go({ coin: c.slug }); };
    $('prevCoin').addEventListener('click', () => step(-1));
    $('nextCoin').addEventListener('click', () => step(1));
    // a page with a few coins: one button per coin in rank order, and nothing to search or to step through
    for (const id of ['prevCoin', 'coinInput', 'nextCoin']) $(id).hidden = few;
    for (const s of few ? WITH_DATA.map((c) => c.slug) : ['btc', 'eth', 'xrp', 'sol', 'doge', 'pepe']) {
      const c = coinBySlug(s); if (!c || !c.t) continue;
      const b = el('button', null, c.s); b.type = 'button'; b.dataset.slug = c.slug; b.addEventListener('click', () => go({ coin: c.slug })); $('quick').append(b);
    }
    const fs = $('famSeg');
    for (const f of FAMS) {
      const b = el('button'); b.type = 'button'; b.dataset.fam = f; b.title = TD.FAMILY_NAMES[f];
      const i = el('i'); i.style.background = `var(--f${f})`; b.append(i, document.createTextNode(FAM_NAME[f]));
      b.addEventListener('click', () => { state.fam = famOn(f) ? state.fam.filter((x) => x !== f) : [...state.fam, f].sort(); save(); syncShell(); renderActive('fam'); });
      fs.append(b);
    }
    addEventListener('hashchange', route);
    let rt = 0, lastW = innerWidth;
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (innerWidth === lastW) return; lastW = innerWidth; tip.hide(); renderActive('resize'); }, 140); });
    const retheme = () => { readColors(); renderActive('theme'); };
    try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme); } catch (e) { /* old browsers */ }
    new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderActive('theme'));
    addEventListener('scroll', () => tip.hide(), { passive: true });
    route();
    try { performance.mark('be-ready'); } catch (e) { /* no performance API */ }
  }

  return { DATA, TFS, OPT, LAST, DAY, COINS, WITH_DATA, FAMS, FAM_NAME, FAM_CODE, FAM_COLOR, SETUP_COLOR, BUY, SELL, SIDE, ARROW, C,
    EX_NAME, GROUP_START, el, esc, iso, nf, fmtPrice, fmtPct, fmtCap, exNames, nameOf, agoText, tvUrl, chipHTML, chipEl, tip, setupCanvas,
    padArray, labelPrice, labelColor, LABEL_FONT, dateTicks, seg, state, save, vstate, famOn, coin, coinBySlug, findCoins, lastBar, isLate,
    trigText, fireText, isDark, hrefOf, side, detail, register, go, openCoin, start };
})();
